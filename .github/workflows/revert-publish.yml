name: Revert publish commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert the two publish commits, newest first
        run: |
          git config user.name "nexlonmedia"
          git config user.email "nexlonmedia20@gmail.com"
          git revert --no-edit 06170b771e33d436ea6100cf915bcd6dbd3345b7
          git revert --no-edit 2718079
          git log --oneline -6
          git push origin main
