name: Remove temporary revert workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete the temporary workflow files
        run: |
          git config user.name "nexlonmedia"
          git config user.email "nexlonmedia20@gmail.com"
          if [ ! -d .github ]; then
            echo "No .github folder; nothing to do."
            exit 0
          fi
          rm -rf .github
          git add -A
          git commit -m "Remove temporary revert workflows"
          git push origin main
